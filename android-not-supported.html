<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsupported Platform</title>
    <style>
    body {
        font-family: Futura, sans-serif;
        text-align: center;
        padding: 50px;
        background-color: #f8f9fa;
        color: #333;
        font-size: 5vw;
        background-image: url('unnamed.png');
        background-size: cover; /* Ensures the image covers the entire background */
        background-position: center; /* Centers the image */
        background-repeat: no-repeat; /* Prevents the image from repeating */
        height: 100vh; /* Ensures the body takes up the full viewport height */
        margin: 0;
    }
    h1, p {
        position: relative;
        top: 40%; /* Pushes the text 30% down the screen */
        transform: translateY(-30%); /* Centers the text block vertically */
        margin: 0;
    }
    h1 {
        color: #000000;
    }
    p {
        font-size: 4vw;
    }

    p2 {
        font-size: 4vw;
        color: #00000000;
    }
    </style>
</head>
<body>
    <h1>Unsupported Platform</h1>
    <p>We're sorry, but this website does not work on Android devices.</p>
    <p>Please view it on an iOS, macOS, or Windows device for the best experience.</p>
    <p2>    sdfsdf</p2>
    <p>Support for anderoid might take a while as I do not have an anderoid device at home to test with</p>
</body>
</html>
